<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Kustomize</title>
    <link rel="stylesheet" href="homepagestyles.css" />
    <style>
        .form-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .text-center {
            text-align: center;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .error-message {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .logo img {
            height: 85px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="homepage.html"><img src="logo.png" alt="Kustomize"></a>
        </div>
        <nav class="nav-links">
            <a href="homepage.html">Home</a>
            <a href="cart.html" class="cart-icon">Cart <i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></a>
            <a href="favorites.html" class="favorites-icon">Favorites <i class="fas fa-heart"></i><span class="favorites-count">0</span></a>
            <a href="login.html" class="active">Sign In / Sign Up <i class="fas fa-sign-in-alt"></i></a>
        </nav>
    </header>

    <div class="form-container">
        <h2 class="text-center">Welcome Back</h2>
        <p class="text-center" style="color: #666; margin-bottom: 20px;">Please login to your account</p>
        
        <div id="loginError" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password" />
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="text-center mt-20">
            Don't have an account? <a href="signup.html" onclick="localStorage.removeItem('isLoggedIn')">Sign up</a>
        </p>
        <p class="text-center">
            <a href="forgotpassword.html">Forgot Password?</a>
        </p>
    </div>

    <script src="navbarState.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userProfile = JSON.parse(localStorage.getItem('userProfile'));
            const errorMsg = document.getElementById('loginError');

            if (userProfile && email === userProfile.email && password === userProfile.password) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.replace('profile.html');
            } else {
                errorMsg.textContent = 'Invalid email or password';
                errorMsg.style.display = 'block';
                // Clear password field
                document.getElementById('password').value = '';
            }
        });

        // Update cart and favorites count
        function updateCounts() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            document.querySelector('.cart-count').textContent = isLoggedIn ? cart.reduce((sum, item) => sum + item.quantity, 0) : '0';
            document.querySelector('.favorites-count').textContent = isLoggedIn ? favorites.length : '0';
        }

        // Initialize counts
        document.addEventListener('DOMContentLoaded', updateCounts);
    </script>
</body>
</html>
