<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Kustomize</title>
    <link rel="stylesheet" href="homepagestyles.css">
    <style>
        .form-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .text-center {
            text-align: center;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .error-message {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            color: #059669;
            background: #d1fae5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .logo img {
            height: 85px;
        }

        /* Reset Form Styles */
        .reset-form {
            display: none;
        }

        .form-description {
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="homepage.html"><img src="logo.png" alt="Kustomize"></a>
        </div>
        <nav class="nav-links">
            <a href="homepage.html">Home</a>
            <a href="cart.html" class="cart-icon">Cart <i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></a>
            <a href="favorites.html" class="favorites-icon">Favorites <i class="fas fa-heart"></i><span class="favorites-count">0</span></a>
            <a href="login.html">Sign In / Sign Up <i class="fas fa-sign-in-alt"></i></a>
        </nav>
    </header>

    <div class="form-container">
        <!-- Email Form -->
        <div id="emailForm">
            <h2 class="text-center">Reset Password</h2>
            <p class="form-description">Enter your email address and we'll help you reset your password.</p>
            
            <div id="emailError" class="error-message"></div>
            <div id="emailSuccess" class="success-message"></div>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>
        </div>

        <!-- Reset Password Form -->
        <div id="resetForm" class="reset-form">
            <h2 class="text-center">Create New Password</h2>
            <p class="form-description">Please enter your new password.</p>
            
            <div id="resetError" class="error-message"></div>
            
            <form id="passwordResetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="Enter new password" minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="Confirm new password">
                </div>
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
        </div>

        <p class="text-center mt-20">
            <a href="login.html">Back to Login</a>
        </p>
    </div>

    <script src="navbarState.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorMsg = document.getElementById('emailError');
            const successMsg = document.getElementById('emailSuccess');
            
            // Check if email exists in userProfile
            const userProfile = JSON.parse(localStorage.getItem('userProfile'));
            
            if (!userProfile || userProfile.email !== email) {
                errorMsg.textContent = 'No account found with this email address';
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                return;
            }

            // Store email for password reset
            localStorage.setItem('resetEmail', email);
            
            // Show success message
            errorMsg.style.display = 'none';
            successMsg.textContent = 'Password reset link sent to your email';
            successMsg.style.display = 'block';
            
            // Show reset form after 2 seconds
            setTimeout(() => {
                document.getElementById('emailForm').style.display = 'none';
                document.getElementById('resetForm').style.display = 'block';
            }, 2000);
        });

        document.getElementById('passwordResetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('resetError');
            const resetEmail = localStorage.getItem('resetEmail');

            // Validate password
            if (newPassword.length < 8) {
                errorMsg.textContent = 'Password must be at least 8 characters long';
                errorMsg.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.style.display = 'block';
                return;
            }

            // Update password in userProfile
            const userProfile = JSON.parse(localStorage.getItem('userProfile'));
            if (userProfile && userProfile.email === resetEmail) {
                userProfile.password = newPassword;
                localStorage.setItem('userProfile', JSON.stringify(userProfile));
                localStorage.removeItem('resetEmail');
                
                // Redirect to login with success message
                window.location.href = 'login.html';
            }
        });

        // Update cart and favorites count
        function updateCounts() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            document.querySelector('.cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.querySelector('.favorites-count').textContent = favorites.length;
        }

        // Initialize counts
        document.addEventListener('DOMContentLoaded', updateCounts);
    </script>
</body>
</html>
